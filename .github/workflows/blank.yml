name: 🚀 Windows 10 VPS

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "⏱️ Thời gian sử dụng"
        required: false
        default: "5h50m"
        type: choice
        options:
          - "1h"
          - "2h"
          - "3h"
          - "4h"
          - "5h"
          - "5h50m"

jobs:
  VPS-Premium-Setup:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: ⚡ Khởi động hệ thống
        run: |
          Write-Host ""
          Write-Host "╔═══════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║     🚀 Bunvps + Github Actions        ║" -ForegroundColor Cyan
          Write-Host "╠═══════════════════════════════════════╣" -ForegroundColor Cyan
          Write-Host "║  ⏱️  Thời gian: ${{ github.event.inputs.duration }}" -ForegroundColor White
          Write-Host "║  🔧  Hệ thống: Windows Server 2022    ║" -ForegroundColor White
          Write-Host "╚═══════════════════════════════════════╝" -ForegroundColor Cyan
          Write-Host ""

          $dots = ""
          for($i=0; $i -lt 3; $i++) {
              $dots += "."
              Write-Host "`r  ⚙️  Đang khởi động$dots   " -NoNewline -ForegroundColor Blue
              Start-Sleep -Milliseconds 300
          }
          Write-Host "`r  ✅ Hệ thống sẵn sàng!          " -ForegroundColor Green
          Write-Host ""

      - name: 🔧 Cấu hình hệ thống
        run: |
          Write-Host "  🔧 Cấu hình RDP & Firewall..." -ForegroundColor Yellow

          # Cấu hình RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          # Firewall
          netsh advfirewall firewall add rule name="RDP-Premium" dir=in action=allow protocol=TCP localport=3389 profile=any >$null 2>&1
          netsh advfirewall firewall add rule name="RDP-Premium-Out" dir=out action=allow protocol=TCP localport=3389 profile=any >$null 2>&1

          # Dịch vụ
          Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue
          Set-Service -Name UmRdpService -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name TermService -ErrorAction SilentlyContinue
          Start-Service -Name UmRdpService -ErrorAction SilentlyContinue

          Write-Host "  ✅ Cấu hình hoàn tất" -ForegroundColor Green
          Write-Host ""

      - name: 👤 Tạo tài khoản
        run: |
          Write-Host "  👤 Tạo tài khoản..." -ForegroundColor Yellow

          # Tạo mật khẩu ngẫu nhiên
          $matKhau = -join ((65..90) + (97..122) + (48..57) + @(33,35,36,37,38,42,43,45,61) | Get-Random -Count 12 | ForEach-Object {[char]$_})
          $securePass = ConvertTo-SecureString $matKhau -AsPlainText -Force

          # Xóa user cũ
          Remove-LocalUser -Name "DanEmCoVan" -ErrorAction SilentlyContinue

          # Tạo user mới
          New-LocalUser -Name "DanEmCoVan" -Password $securePass -AccountNeverExpires -Description "Dan Em Co Van Account" -ErrorAction SilentlyContinue | Out-Null
          Set-LocalUser -Name "DanEmCoVan" -PasswordNeverExpires $true -ErrorAction SilentlyContinue

          # Cấp quyền
          Add-LocalGroupMember -Group "Administrators" -Member "DanEmCoVan" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "DanEmCoVan" -ErrorAction SilentlyContinue
          Enable-LocalUser -Name "DanEmCoVan"

          # Lưu thông tin
          echo "RDP_USER=DanEmCoVan" >> $env:GITHUB_ENV
          echo "RDP_PASS=$matKhau" >> $env:GITHUB_ENV
          echo "$matKhau" > $env:TEMP\rdp_password.txt

          Write-Host "  ✅ Tài khoản: DanEmCoVan | Pass: $matKhau" -ForegroundColor Green
          Write-Host ""

      - name: 🔍 Kiểm tra hệ thống
        run: |
          Write-Host "  🔍 Kiểm tra hệ thống..." -ForegroundColor Yellow

          $user = Get-LocalUser -Name "DanEmCoVan" -ErrorAction SilentlyContinue
          $isAdmin = (Get-LocalGroupMember -Group "Administrators" | Where-Object {$_.Name -like "*DanEmCoVan"}).Count -gt 0
          $isRDPUser = (Get-LocalGroupMember -Group "Remote Desktop Users" | Where-Object {$_.Name -like "*DanEmCoVan"}).Count -gt 0
          $termService = Get-Service -Name TermService -ErrorAction SilentlyContinue

          if (-not $user -or -not $isAdmin -or -not $isRDPUser -or $termService.Status -ne 'Running') {
              Write-Host "  ❌ Lỗi cấu hình" -ForegroundColor Red
              exit 1
          }

          Write-Host "  ✅ Hệ thống hoạt động tốt" -ForegroundColor Green
          Write-Host ""

      - name: 🌐 Thiết lập mạng
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "  🌐 Thiết lập mạng Tailscale..." -ForegroundColor Yellow

          # Cài Tailscale
          $msiPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msiPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msiPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $msiPath -Force -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 10

          # Kết nối
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=vps-$env:GITHUB_RUN_ID --accept-routes --accept-dns --reset

          # Lấy IP
          $ip = $null
          for($i=0; $i -lt 15; $i++) {
              $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>&1
              if ($ip -and $ip -match '^\d+\.\d+\.\d+\.\d+$') {
                  echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
                  break
              }
              Start-Sleep -Seconds 3
          }

          if (-not $ip -or $ip -notmatch '^\d+\.\d+\.\d+\.\d+$') {
              echo "TAILSCALE_IP=localhost" >> $env:GITHUB_ENV
              $ip = "localhost"
          }

          Write-Host "  ✅ Địa chỉ IP: $ip" -ForegroundColor Green
          Write-Host ""

      - name: 🎉 Thông tin kết nối
        run: |
          $matKhau = Get-Content $env:TEMP\rdp_password.txt -ErrorAction SilentlyContinue
          if (-not $matKhau) {
              $matKhau = "Error"
          }

          $durationInput = "${{ github.event.inputs.duration }}"
          switch ($durationInput) {
              "1h" { $totalMinutes = 60; $displayTime = "1h" }
              "2h" { $totalMinutes = 120; $displayTime = "2h" }
              "3h" { $totalMinutes = 180; $displayTime = "3h" }
              "4h" { $totalMinutes = 240; $displayTime = "4h" }
              "5h" { $totalMinutes = 300; $displayTime = "5h" }
              "5h50m" { $totalMinutes = 350; $displayTime = "5h50m" }
          }

          $timeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById("SE Asia Standard Time")
          $startTime = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $timeZone)
          $endTime = $startTime.AddMinutes($totalMinutes)

          Write-Host ""
          Write-Host "╔═══════════════════════════════════════╗" -ForegroundColor Green
          Write-Host "║        🎉 KẾT NỐI THÀNH CÔNG         ║" -ForegroundColor Green
          Write-Host "╠═══════════════════════════════════════╣" -ForegroundColor Green
          Write-Host "║                                       ║" -ForegroundColor Green
          Write-Host "║  🌐 IP      : $env:TAILSCALE_IP" -ForegroundColor White
          Write-Host "║  👤 User    : DanEmCoVan              ║" -ForegroundColor White
          Write-Host "║  🔐 Pass    : $matKhau" -ForegroundColor Cyan
          Write-Host "║  📍 Port    : 3389                    ║" -ForegroundColor White
          Write-Host "║                                       ║" -ForegroundColor Green
          Write-Host "║  ⏱️  Thời gian: $displayTime                    ║" -ForegroundColor Yellow
          Write-Host "║  🕐 Bắt đầu : $($startTime.ToString('HH:mm:ss'))                  ║" -ForegroundColor Yellow
          Write-Host "║  🕐 Kết thúc: $($endTime.ToString('HH:mm:ss'))                  ║" -ForegroundColor Yellow
          Write-Host "║                                       ║" -ForegroundColor Green
          Write-Host "╠═══════════════════════════════════════╣" -ForegroundColor Green
          Write-Host "║  💡 Mở Remote Desktop Connection      ║" -ForegroundColor Magenta
          Write-Host "║  💡 Nhập IP và đăng nhập              ║" -ForegroundColor Magenta
          Write-Host "╚═══════════════════════════════════════╝" -ForegroundColor Green
          Write-Host ""

          echo "TOTAL_MINUTES=$totalMinutes" >> $env:GITHUB_ENV

      - name: ⏳ Duy trì phiên
        run: |
          $totalMinutes = $env:TOTAL_MINUTES
          $timeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById("SE Asia Standard Time")
          $startTime = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $timeZone)
          $endTime = $startTime.AddMinutes($totalMinutes)

          Write-Host "  ⏳ Phiên đã bắt đầu - IP: $env:TAILSCALE_IP" -ForegroundColor Cyan
          Write-Host ""

          # Monitor background
          $monitorScript = {
              while ($true) {
                  $termService = Get-Service -Name TermService -ErrorAction SilentlyContinue
                  if ($termService.Status -ne 'Running') {
                      Start-Service -Name TermService -ErrorAction SilentlyContinue
                  }
                  Start-Sleep -Seconds 30
              }
          }

          Start-Job -ScriptBlock $monitorScript -Name "Monitor" | Out-Null

          # Timer
          $colors = @('Cyan', 'Green', 'Yellow', 'Magenta')
          do {
              $now = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $timeZone)
              $remaining = $endTime - $now
              
              $h = [math]::Max(0, [math]::Floor($remaining.TotalHours))
              $m = [math]::Max(0, [math]::Floor($remaining.TotalMinutes % 60))
              $s = [math]::Max(0, [math]::Floor($remaining.TotalSeconds % 60))
              
              $color = $colors[([int]$remaining.TotalMinutes) % $colors.Length]
              Write-Host "`r  ⏱️  [$($now.ToString('HH:mm:ss'))] Còn lại: ${h}h ${m}m ${s}s   " -NoNewline -ForegroundColor $color
              
              Start-Sleep -Seconds 5
              
          } while ($remaining.TotalSeconds -gt 0)

          Write-Host ""
          Write-Host ""
          Write-Host "  🎯 Hết thời gian!" -ForegroundColor Red
          Write-Host ""

          Get-Job -Name "Monitor" -ErrorAction SilentlyContinue | Stop-Job -PassThru | Remove-Job -Force

      - name: 🧹 Dọn dẹp
        if: always()
        run: |
          Write-Host "  🧹 Dọn dẹp hệ thống..." -ForegroundColor Yellow

          Remove-Item "$env:TEMP\rdp_password.txt" -ErrorAction SilentlyContinue
          Disable-LocalUser -Name "DanEmCoVan" -ErrorAction SilentlyContinue

          # Đóng Tailscale nếu đã cài đặt
          $tailscalePath = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (Test-Path $tailscalePath) {
              & $tailscalePath down --accept-risk=all 2>&1 | Out-Null
          }

          netsh advfirewall firewall delete rule name="RDP-Premium" dir=in >$null 2>&1
          netsh advfirewall firewall delete rule name="RDP-Premium-Out" dir=out >$null 2>&1

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 1 -Force -ErrorAction SilentlyContinue
          Stop-Service -Name TermService -Force -ErrorAction SilentlyContinue

          Get-Job | Stop-Job -PassThru | Remove-Job -Force -ErrorAction SilentlyContinue

          Write-Host "  ✅ Hoàn tất! Hẹn gặp lại 👋" -ForegroundColor Green
          Write-Host ""
